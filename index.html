{% extends "base.html" %}
{% block titulo %}Catálogo{% endblock %}
{% block contenido %}
<h2>Productos</h2>
<div class="productos">
    {% for producto in productos %}
    <article class="producto">
        <img src="{{ url_for('static', filename=producto.foto) }}" alt="{{ producto.nombre }}">
        <h3>{{ producto.nombre }}</h3>
        <p>Marca: {{ producto.marca }}</p>
        <p>Precio: ${{ "{:,}".format(producto.precio).replace(",", ".") }}</p>
        <a href="{{ url_for('main.detalle', sku=producto.sku) }}">Ver detalle</a>
    </article>
    {% endfor %}
</div>
{% endblock %}
