{% extends "base.html" %}
{% block titulo %}Detalle del producto{% endblock %}
{% block contenido %}
<article class="detalle">
    <img src="{{ url_for('static', filename=producto.foto) }}" alt="{{ producto.nombre }}">
    <h2>{{ producto.nombre }}</h2>
    <p>Marca: {{ producto.marca }}</p>
    <p>SKU: {{ producto.sku }}</p>
    <p>Precio: ${{ "{:,}".format(producto.precio).replace(",", ".") }}</p>
    <a href="{{ url_for('main.index') }}">Volver al catálogo</a>
</article>
{% endblock %}
